<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Space Rush</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #15213f 0%, #090d1f 42%, #02050d 100%);
      color: white;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      width: min(95vw, 1000px);
      height: min(90vh, 700px);
      border: 4px solid #4ea2ff;
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(78, 162, 255, 0.35);
      background: linear-gradient(#091224, #040912 40%, #02050d);
      display: block;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 16px;
      padding: 12px 18px;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(78,162,255,0.8);
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      z-index: 10;
    }
    .help {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(78,162,255,0.5);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 12px;
      color: #dfeaff;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
    <div>Level: <span id="level">1</span></div>
  </div>
  <canvas id="game" width="1000" height="700"></canvas>
  <div class="help">Move: WASD / Arrow Keys · Space to pause</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreLabel = document.getElementById('score');
    const bestLabel = document.getElementById('best');
    const levelLabel = document.getElementById('level');

    const keys = {};
    let score = 0;
    let level = 1;
    let best = Number(localStorage.getItem('spaceRushBest') || 0);
    let lastTime = 0;
    let spawnTimer = 0;
    let starTimer = 0;
    let gameOver = false;
    let paused = false;
    let audioCtx = null;

    bestLabel.textContent = best;

    const ship = {
      x: canvas.width / 2,
      y: canvas.height - 80,
      w: 34,
      h: 42,
      speed: 420,
      alive: true
    };

    const stars = [];
    const asteroids = [];
    const bullets = [];

    function initAudio() {
      if (!audioCtx && window.AudioContext) {
        audioCtx = new AudioContext();
      }
    }

    function playTone(freq, duration, type = 'sine', volume = 0.05) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = type;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function makeStar() {
      return {
        x: Math.random() * (canvas.width - 20) + 10,
        y: -20,
        r: 5 + Math.random() * 4,
        speed: 150 + Math.random() * 140,
        drift: (Math.random() - 0.5) * 60
      };
    }

    function makeAsteroid() {
      const size = 18 + Math.random() * 28;
      return {
        x: Math.random() * (canvas.width - size * 2) + size,
        y: -size,
        r: size,
        speed: 140 + Math.random() * 120 + level * 12,
        dx: (Math.random() - 0.5) * 60,
        rot: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 2.5
      };
    }

    function resetGame() {
      score = 0;
      level = 1;
      ship.x = canvas.width / 2;
      ship.y = canvas.height - 80;
      ship.alive = true;
      asteroids.length = 0;
      bullets.length = 0;
      stars.length = 0;
      for (let i = 0; i < 60; i++) stars.push(makeStar());
      spawnTimer = 0;
      starTimer = 0;
      gameOver = false;
      paused = false;
      scoreLabel.textContent = score;
      levelLabel.textContent = level;
    }

    function shoot() {
      if (!ship.alive || gameOver || paused) return;
      bullets.push({
        x: ship.x,
        y: ship.y - 18,
        r: 4,
        speed: 700
      });
      playTone(700, 0.07, 'square', 0.04);
    }

    function update(dt) {
      if (gameOver || paused) return;

      // movement
      const dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
      const dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);

      ship.x += dx * ship.speed * dt;
      ship.y += dy * ship.speed * dt;
      ship.x = Math.max(20, Math.min(canvas.width - 20, ship.x));
      ship.y = Math.max(30, Math.min(canvas.height - 30, ship.y));

      // bullet firing via auto fire
      if (keys[' '] || keys['space']) {
        shoot();
      }

      // stars animation
      for (const star of stars) {
        star.y += star.speed * dt;
        star.x += star.drift * dt;
        if (star.y > canvas.height + 20) {
          Object.assign(star, makeStar());
          star.y = -10;
        }
      }

      // spawn asteroids
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        const count = Math.min(2 + Math.floor(level / 2), 5);
        for (let i = 0; i < count; i++) asteroids.push(makeAsteroid());
        spawnTimer = Math.max(0.5, 1.4 - level * 0.08);
      }

      // asteroid movement
      for (const asteroid of asteroids) {
        asteroid.y += asteroid.speed * dt;
        asteroid.x += asteroid.dx * dt;
        asteroid.rot += asteroid.spin * dt;

        // wrap slightly
        if (asteroid.x < -50) asteroid.x = canvas.width + 50;
        if (asteroid.x > canvas.width + 50) asteroid.x = -50;
      }

      // bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed * dt;
        if (bullets[i].y < -20) bullets.splice(i, 1);
      }

      // collision bullets with asteroids
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const asteroid = asteroids[i];
        for (let j = bullets.length - 1; j >= 0; j--) {
          const bullet = bullets[j];
          const dx = asteroid.x - bullet.x;
          const dy = asteroid.y - bullet.y;
          if (Math.hypot(dx, dy) < asteroid.r + bullet.r) {
            asteroids.splice(i, 1);
            bullets.splice(j, 1);
            score += 10;
            scoreLabel.textContent = score;
            if (score > best) {
              best = score;
              bestLabel.textContent = best;
              localStorage.setItem('spaceRushBest', best);
            }
            level = Math.floor(score / 100) + 1;
            levelLabel.textContent = level;
            playTone(600, 0.08, 'triangle', 0.05);
            break;
          }
        }
      }

      // collision with ship
      for (const asteroid of asteroids) {
        const dx = asteroid.x - ship.x;
        const dy = asteroid.y - ship.y;
        if (Math.hypot(dx, dy) < asteroid.r + 18) {
          gameOver = true;
          ship.alive = false;
          playTone(180, 0.3, 'sawtooth', 0.08);
          break;
        }
      }

      // remove offscreen asteroids
      for (let i = asteroids.length - 1; i >= 0; i--) {
        if (asteroids[i].y > canvas.height + 50) {
          asteroids.splice(i, 1);
        }
      }
    }

    function drawStar(star) {
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fillStyle = '#dfeaff';
      ctx.fill();
    }

    function drawShip() {
      ctx.save();
      ctx.translate(ship.x, ship.y);

      // ship body
      ctx.fillStyle = '#4ea2ff';
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(18, 20);
      ctx.lineTo(0, 12);
      ctx.lineTo(-18, 20);
      ctx.closePath();
      ctx.fill();

      // engine glow
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.moveTo(-6, 20);
      ctx.lineTo(0, 33);
      ctx.lineTo(6, 20);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawAsteroid(asteroid) {
      ctx.save();
      ctx.translate(asteroid.x, asteroid.y);
      ctx.rotate(asteroid.rot);
      ctx.fillStyle = '#9aa5b1';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const radius = asteroid.r * (0.8 + ((i % 2) * 0.35));
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBullets() {
      ctx.fillStyle = '#facc15';
      for (const bullet of bullets) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGameOver() {
      if (!gameOver) return;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 60px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = 'bold 28px Arial';
      ctx.fillStyle = '#facc15';
      ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 30);
    }

    function drawPaused() {
      if (!paused || gameOver) return;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) drawStar(star);
      drawBullets();
      for (const asteroid of asteroids) drawAsteroid(asteroid);
      drawShip();
      drawPaused();
      drawGameOver();
    }

    function mainLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.03);
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(mainLoop);
    }

    window.addEventListener('keydown', (e) => {
      initAudio();
      const key = e.key.toLowerCase();
      keys[key] = true;

      if (key === ' ' || key === 'space') {
        if (!gameOver) paused = !paused;
      }
      if (key === 'r') resetGame();

      if ((key === 'arrowup' || key === 'w' || key === 'arrowdown' || key === 's' ||
           key === 'arrowleft' || key === 'a' || key === 'arrowright' || key === 'd')) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    resetGame();
    requestAnimationFrame(mainLoop);
  </script>
</body>
</html>
