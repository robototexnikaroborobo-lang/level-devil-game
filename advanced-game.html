<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Level Devil - Advanced</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d1f;
      color: white;
      font-family: Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    #game {
      width: min(96vw, 1200px);
      height: min(82vh, 600px);
      display: block;
      border: 4px solid #4ea2ff;
      border-radius: 18px;
      background: linear-gradient(#111a2a, #0b1223 45%, #070c18 100%);
      box-shadow: 0 0 30px rgba(78, 162, 255, 0.35);
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.45);
      border: 2px solid rgba(78, 162, 255, 0.9);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      z-index: 10;
      line-height: 1.6;
    }
    .help {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.4);
      color: #dfeaff;
      border: 1px solid rgba(78, 162, 255, 0.5);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud"></div>
  <canvas id="game" width="1200" height="600"></canvas>
  <div class="help">Move: A/D or ←/→ · Jump: W / ↑ / Space · Restart: R · Sound: M</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    const keys = {};
    let currentLevel = 0;
    let player = null;
    let gameOver = false;
    let totalDeaths = 0;
    let levelDeaths = 0;
    let levelStartTime = 0;
    let gameStarted = false;
    let audioCtx = null;

    // Basic sound manager with no errors if browser blocks audio
    function initAudio() {
      if (!audioCtx && window.AudioContext) {
        audioCtx = new AudioContext();
      }
    }

    function playTone(freq, duration, type = 'sine', volume = 0.04) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSound(name) {
      if (!audioCtx) return;
      if (name === 'jump') playTone(520, 0.12, 'square', 0.05);
      if (name === 'death') playTone(180, 0.3, 'sawtooth', 0.08);
      if (name === 'win') {
        playTone(440, 0.12, 'triangle', 0.06);
        setTimeout(() => playTone(660, 0.12, 'triangle', 0.06), 100);
        setTimeout(() => playTone(880, 0.18, 'triangle', 0.06), 200);
      }
      if (name === 'trap') playTone(220, 0.18, 'sawtooth', 0.06);
    }

    const levels = [
      {
        name: 'Level 1',
        start: { x: 50, y: 460 },
        platforms: [
          { x: 0, y: 540, w: 260, h: 60 },
          { x: 340, y: 480, w: 180, h: 20 },
          { x: 570, y: 420, w: 150, h: 20 },
          { x: 760, y: 340, w: 150, h: 20 },
          { x: 960, y: 540, w: 220, h: 60 }
        ],
        spikes: [
          { x: 260, y: 540, w: 70, h: 20 },
          { x: 520, y: 540, w: 35, h: 20 }
        ],
        doors: [
          { x: 1115, y: 450, w: 60, h: 90, fake: false }
        ],
        message: 'Reach the green door.'
      },
      {
        name: 'Level 2',
        start: { x: 50, y: 460 },
        platforms: [
          { x: 0, y: 540, w: 260, h: 60 },
          { x: 330, y: 480, w: 150, h: 20 },
          { x: 560, y: 420, w: 130, h: 20 },
          { x: 760, y: 500, w: 180, h: 20 },
          { x: 1030, y: 540, w: 170, h: 60 }
        ],
        spikes: [
          { x: 260, y: 540, w: 55, h: 20 },
          { x: 510, y: 540, w: 30, h: 20 },
          { x: 940, y: 540, w: 40, h: 20 }
        ],
        doors: [
          { x: 1160, y: 450, w: 60, h: 90, fake: false },
          { x: 800, y: 400, w: 60, h: 90, fake: true }
        ],
        message: 'The red door is a trap.'
      },
      {
        name: 'Level 3',
        start: { x: 50, y: 460 },
        platforms: [
          { x: 0, y: 540, w: 280, h: 60 },
          { x: 360, y: 480, w: 160, h: 20 },
          { x: 560, y: 420, w: 140, h: 20, disappearOnTouch: true },
          { x: 760, y: 470, w: 180, h: 20 },
          { x: 1020, y: 540, w: 180, h: 60 }
        ],
        spikes: [
          { x: 280, y: 540, w: 60, h: 20 },
          { x: 520, y: 540, w: 30, h: 20 },
          { x: 740, y: 540, w: 30, h: 20 }
        ],
        doors: [
          { x: 1140, y: 450, w: 60, h: 90, fake: false }
        ],
        message: 'Some platforms vanish.'
      },
      {
        name: 'Level 4',
        start: { x: 50, y: 460 },
        platforms: [
          { x: 0, y: 540, w: 300, h: 60 },
          { x: 380, y: 480, w: 160, h: 20 },
          { x: 610, y: 420, w: 140, h: 20 },
          { x: 820, y: 340, w: 150, h: 20 },
          { x: 1000, y: 540, w: 200, h: 60 }
        ],
        spikes: [
          { x: 300, y: 540, w: 60, h: 20 },
          { x: 540, y: 540, w: 35, h: 20 },
          { x: 750, y: 540, w: 35, h: 20 },
          { x: 970, y: 540, w: 35, h: 20 }
        ],
        doors: [
          { x: 1160, y: 450, w: 60, h: 90, fake: false },
          { x: 680, y: 300, w: 60, h: 90, fake: true },
          { x: 850, y: 250, w: 60, h: 90, fake: true }
        ],
        message: 'Two fake exits. One real.'
      },
      {
        name: 'Level 5',
        start: { x: 50, y: 460 },
        platforms: [
          { x: 0, y: 540, w: 260, h: 60 },
          { x: 350, y: 480, w: 170, h: 20 },
          { x: 600, y: 420, w: 130, h: 20 },
          { x: 820, y: 360, w: 150, h: 20 },
          { x: 1030, y: 540, w: 170, h: 60 }
        ],
        spikes: [
          { x: 260, y: 540, w: 60, h: 20 },
          { x: 520, y: 540, w: 30, h: 20 },
          { x: 730, y: 540, w: 30, h: 20 },
          { x: 970, y: 540, w: 30, h: 20 }
        ],
        doors: [
          { x: 1160, y: 450, w: 60, h: 90, fake: false }
        ],
        message: 'Your controls flip later.'
      }
    ];

    function createPlayer(x, y) {
      return {
        x, y,
        w: 28,
        h: 42,
        vx: 0,
        vy: 0,
        speed: 4.8,
        jumpForce: 14,
        gravity: 0.72,
        onGround: false,
        dir: 1,
        flipped: false,
        flipTimer: 0,
        color: '#facc15'
      };
    }

    function loadLevel(index) {
      currentLevel = index;
      const level = levels[currentLevel];
      player = createPlayer(level.start.x, level.start.y);
      gameOver = false;
      levelDeaths = 0;
      levelStartTime = Date.now();
      hud.innerHTML = `Level ${currentLevel + 1}/${levels.length}<br>Deaths: ${totalDeaths}<br>Time: 0s`;
      level.platforms.forEach(p => p.triggered = false);
    }

    function resetLevel() {
      if (!gameStarted) return;
      totalDeaths += 1;
      playSound('death');
      loadLevel(currentLevel);
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function getActivePlatforms() {
      return levels[currentLevel].platforms.filter(p => !(p.disappearOnTouch && p.triggered));
    }

    function hitSpike() {
      for (const spike of levels[currentLevel].spikes) {
        if (rectsIntersect(player, spike)) return true;
      }
      return false;
    }

    function hitDoor() {
      for (const door of levels[currentLevel].doors) {
        if (door.fake && rectsIntersect(player, door)) return 'fake';
        if (!door.fake && rectsIntersect(player, door)) return 'goal';
      }
      return null;
    }

    function winLevel() {
      playSound('win');
      if (currentLevel < levels.length - 1) {
        currentLevel += 1;
        loadLevel(currentLevel);
      } else {
        alert('You escaped the devil!');
        currentLevel = 0;
        loadLevel(currentLevel);
      }
    }

    function update() {
      if (!gameStarted || !player || gameOver) return;

      const level = levels[currentLevel];

      let moveX = 0;
      if (keys['d'] || keys['arrowright']) moveX += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;

      if (player.flipped) moveX *= -1;

      if (moveX !== 0) {
        player.vx = moveX * player.speed;
        player.dir = moveX;
      } else {
        player.vx = 0;
      }

      if ((keys['w'] || keys['arrowup'] || keys[' ']) && player.onGround) {
        player.vy = -player.jumpForce;
        player.onGround = false;
        playSound('jump');
      }

      if (player.flipTimer > 0) {
        player.flipTimer -= 1;
      } else {
        player.flipped = false;
      }

      if (level.name === 'Level 5' && player.x > 700 && !player.flipped) {
        player.flipped = true;
        player.flipTimer = 120;
        playSound('trap');
      }

      player.vy += player.gravity;
      player.x += player.vx;

      for (const platform of getActivePlatforms()) {
        if (rectsIntersect(player, platform)) {
          if (player.vx > 0) player.x = platform.x - player.w;
          if (player.vx < 0) player.x = platform.x + platform.w;
        }
      }

      player.y += player.vy;
      player.onGround = false;

      for (const platform of getActivePlatforms()) {
        if (rectsIntersect(player, platform)) {
          if (player.vy > 0) {
            player.y = platform.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (player.vy < 0) {
            player.y = platform.y + platform.h;
            player.vy = 0;
          }

          if (platform.disappearOnTouch && !platform.triggered) {
            platform.triggered = true;
          }
        }
      }

      if (player.y > canvas.height + 80) {
        resetLevel();
        return;
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > 1600) player.x = 1600 - player.w;

      if (hitSpike()) {
        resetLevel();
        return;
      }

      const doorState = hitDoor();
      if (doorState === 'fake') {
        playSound('trap');
        resetLevel();
        return;
      }
      if (doorState === 'goal') {
        winLevel();
        return;
      }

      const elapsed = Math.floor((Date.now() - levelStartTime) / 1000);
      hud.innerHTML = `Level ${currentLevel + 1}/${levels.length}<br>Deaths: ${totalDeaths}<br>Time: ${elapsed}s`;
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#1d2440');
      g.addColorStop(1, '#0b0f1a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawPlatforms() {
      for (const platform of getActivePlatforms()) {
        const grad = ctx.createLinearGradient(platform.x, platform.y, platform.x, platform.y + platform.h);
        grad.addColorStop(0, '#8aa0b8');
        grad.addColorStop(1, '#687a91');
        ctx.fillStyle = grad;
        ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
      }

      for (const door of levels[currentLevel].doors) {
        ctx.fillStyle = door.fake ? '#e05252' : '#3bd17a';
        ctx.fillRect(door.x, door.y, door.w, door.h);
        ctx.fillStyle = '#dfe9ff';
        ctx.fillRect(door.x + 10, door.y + 10, door.w - 20, door.h - 20);
      }
    }

    function drawSpikes() {
      for (const spike of levels[currentLevel].spikes) {
        ctx.fillStyle = '#e94f4f';
        const count = Math.max(3, Math.floor(spike.w / 7));
        const step = spike.w / count;
        for (let i = 0; i < count; i++) {
          const x = spike.x + i * step;
          ctx.beginPath();
          ctx.moveTo(x, spike.y + spike.h);
          ctx.lineTo(x + step / 2, spike.y);
          ctx.lineTo(x + step, spike.y + spike.h);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    function drawPlayer() {
      if (!player) return;

      ctx.save();
      ctx.translate(player.x, player.y);

      ctx.fillStyle = player.flipped ? '#ff7d7d' : '#f7c948';
      ctx.fillRect(0, 0, player.w, player.h);

      ctx.fillStyle = '#1d2430';
      const leftEyeX = player.dir > 0 ? 8 : 15;
      const rightEyeX = player.dir > 0 ? 18 : 5;
      ctx.fillRect(leftEyeX, 10, 4, 4);
      ctx.fillRect(rightEyeX, 10, 4, 4);

      ctx.fillStyle = '#f8f9ff';
      ctx.fillRect(6, 30, player.w - 12, 4);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      drawPlatforms();
      drawSpikes();
      drawPlayer();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key) || key === ' ') {
        event.preventDefault();
      }
      keys[key] = true;
      if (key === 'r') resetLevel();
      if (key === 'm') {
        initAudio();
        if (audioCtx) {
          audioCtx.resume();
        }
      }
    });

    window.addEventListener('keyup', (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    function startGame() {
      initAudio();
      gameStarted = true;
      totalDeaths = 0;
      currentLevel = 0;
      loadLevel(0);
    }

    startGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
