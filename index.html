<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Devil - HTML Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="top-bar">
        <div>
          <h1>LEVEL DEVIL</h1>
        </div>
        <div class="status" id="status">Level 1</div>
      </div>

      <canvas id="game" width="960" height="540"></canvas>

      <div class="controls">
        <div>Move: A/D or ←/→</div>
        <div>Jump: W / ↑ / Space</div>
        <div>Restart: R</div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
